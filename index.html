<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>iNaturalist – Species on the land</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive map of selected iNaturalist observations rendered with Leaflet." />

  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="map" aria-label="Map showing selected iNaturalist observations"></div>

  <div id="loading-overlay" aria-live="polite">
    <div class="loading-content">
      <svg class="spinner" viewBox="0 0 50 50" role="img" aria-label="Loading">
        <circle cx="25" cy="25" r="20"></circle>
      </svg>
      <div class="loading-text">Loading iNaturalist data...</div>
    </div>
  </div>

  <div id="gallery-panel" class="gallery-panel" aria-label="Random observations panel">
  <div class="gallery-header">
    <div class="gallery-left">
      <button id="shuffle-btn" class="gallery-icon-btn" type="button" aria-label="Refresh gallery" title="Refresh">↻</button>
      <div class="gallery-title">Species in the area</div>
    </div>

    <button id="minimize-btn" class="gallery-icon-btn" type="button" aria-label="Minimize gallery" title="Minimize">−</button>
  </div>

  <div id="gallery-grid" class="gallery-grid"></div>
</div>


  <div id="app-attribution">
    iNaturalist data © individual contributors, some rights reserved; data via iNaturalist API.
    Basemap © Esri and contributors.
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/esri-leaflet@3.0.8/dist/esri-leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.pattern@0.1.0/dist/leaflet.pattern.js"></script>
  <script src="script_sp_land.js"></script>
</body>

</html>
